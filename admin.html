<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>vx.manager</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#fff;
  --paper:#fbfbf9;
  --ink:#171717;
  --mute:#85857f;
  --faint:#b9b9b3;
  --line:#e9e9e4;
  --fill:#f4f4f1;
  --ease:cubic-bezier(.2,.7,.2,1);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  background: var(--bg);
  color: var(--ink);
  font:
    13px/1.7 "IBM Plex Mono",
    ui-monospace,
    Menlo,
    Consolas,
    monospace;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 120px;
}
a {
  color: inherit;
  text-decoration: none;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
  text-align: left;
}
svg.i {
  width: 1em;
  height: 1em;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
::selection {
  background: var(--ink);
  color: #fff;
}
.wrap {
  max-width: 840px;
  margin: 0 auto;
  padding: 0 24px;
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 30px 0 18px;
}
.top h1 {
  font-size: 20px;
  letter-spacing: -.01em;
}
.top h1 .cur {
  display: inline-block;
  animation: blink 1.1s steps(1) infinite;
}
@keyframes blink {
  50% {
    opacity: 0;
  }
}
.acts {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.chip {
  font-size: 9.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--mute);
  display: flex;
  align-items: center;
  gap: 7px;
  margin-right: 6px;
}
.chip::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #3a9d5d;
  transition: background .3s;
}
.chip.dirty::before {
  background: #d98b1c;
  animation: pulse 1.4s infinite;
}
@keyframes pulse {
  50% {
    opacity: .35;
  }
}
.b {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 13px;
  border: 1px solid var(--ink);
  font-size: 11px;
  background: linear-gradient(var(--ink), var(--ink)) left/0 100% no-repeat;
  transition:
    background-size .4s var(--ease),
    color .3s,
    opacity .2s,
    transform .3s var(--ease);
}
.b:hover {
  background-size: 100% 100%;
  color: #fff;
}
.b:active {
  transform: scale(.97);
}
.b.solid {
  background: var(--ink);
  color: #fff;
}
.b.solid:hover {
  background: #000;
}
.b.sm {
  padding: 3px 8px;
  font-size: 10px;
  border-color: var(--line);
}
.b.sm:hover {
  border-color: var(--ink);
}
.b.dng:hover {
  background-image: linear-gradient(#b3261e, #b3261e);
  border-color: #b3261e;
}
.b[disabled] {
  opacity: .4;
  pointer-events: none;
}
.tabs {
  position: relative;
  display: flex;
  gap: 24px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}
.tab {
  position: relative;
  padding: 0 0 11px;
  font-size: 11.5px;
  color: var(--mute);
  white-space: nowrap;
  transition: color .2s;
}
.tab:hover,
.tab.on {
  color: var(--ink);
}
.tab sup {
  font-size: 8px;
  color: var(--faint);
  margin-left: 3px;
}
.ink {
  position: absolute;
  left: 0;
  bottom: -1px;
  height: 1px;
  background: var(--ink);
  transition: left .4s var(--ease), width .4s var(--ease);
}
.panel {
  padding-top: 26px;
  animation: in .45s var(--ease);
}
@keyframes in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
}
.hint {
  font-size: 10.5px;
  color: var(--mute);
}
.bn {
  background: var(--fill);
  border: 1px solid var(--line);
  padding: 10px 14px;
  font-size: 11px;
  margin-bottom: 18px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.fld {
  display: block;
  margin-bottom: 14px;
}
.fld > span {
  display: block;
  font-size: 9.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--mute);
  margin-bottom: 5px;
}
.fld input[type=text],
.fld input[type=password],
.fld select,
.fld textarea,
.tx {
  width: 100%;
  border: 1px solid var(--line);
  background: #fff;
  padding: 8px 10px;
  font: inherit;
  font-size: 12px;
  outline: none;
  border-radius: 0;
  transition: border-color .2s, box-shadow .2s;
}
.fld textarea {
  min-height: 84px;
  resize: vertical;
}
.fld input:focus,
.fld select:focus,
.fld textarea:focus,
.tx:focus {
  border-color: var(--ink);
  box-shadow: 3px 3px 0 var(--fill);
}
.chk {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 12px;
  margin-bottom: 14px;
}
.item {
  border: 1px solid var(--line);
  margin-bottom: 10px;
  background: #fff;
  animation: in .4s var(--ease);
  transition: border-color .2s;
}
.item:hover {
  border-color: var(--faint);
}
.ih {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
}
.ih .n {
  font-size: 9px;
  color: var(--faint);
  width: 18px;
}
.ih .ti {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}
.ih .ti i {
  font-style: normal;
  color: var(--mute);
  font-size: 10px;
  margin-left: 8px;
}
.ctl {
  display: flex;
  gap: 6px;
}
.ib {
  padding: 14px 16px 4px;
  border-top: 1px solid var(--line);
  animation: in .35s var(--ease);
}
.add {
  margin-bottom: 16px;
}
.empty {
  padding: 28px;
  border: 1px dashed var(--line);
  color: var(--mute);
  font-size: 11.5px;
  text-align: center;
}
.imgf {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  margin-bottom: 14px;
}
.th {
  width: 120px;
  aspect-ratio: 16/10;
  flex-shrink: 0;
  background: var(--fill);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  overflow: hidden;
  color: var(--faint);
  font-size: 9px;
}
.th img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.imgf .r {
  flex: 1;
  display: grid;
  gap: 8px;
  min-width: 0;
}
.imgf .row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translate(-50%, 20px);
  background: var(--ink);
  color: #fff;
  font-size: 11.5px;
  padding: 10px 16px;
  opacity: 0;
  pointer-events: none;
  transition: .4s var(--ease);
  z-index: 90;
  max-width: 90vw;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
.toast.bad {
  background: #b3261e;
}
.gate {
  position: fixed;
  inset: 0;
  background: rgba(251, 251, 249, .97);
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 20px;
}
.gate .box {
  width: min(380px, 100%);
  background: #fff;
  border: 1px solid var(--line);
  padding: 30px;
  box-shadow: 6px 6px 0 var(--fill);
}
.gate h2 {
  font-size: 16px;
  margin: 6px 0 16px;
}
.gate form {
  display: flex;
  gap: 8px;
}
.gate input {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--line);
  padding: 9px 11px;
  font: inherit;
  font-size: 12px;
  outline: none;
}
.gate input:focus {
  border-color: var(--ink);
}
.gate .err {
  height: 14px;
  margin-top: 10px;
  font-size: 10px;
  color: #b3261e;
}
.shake {
  animation: shake .4s;
}
@keyframes shake {
  20%, 60% {
    transform: translateX(-7px);
  }
  40%, 80% {
    transform: translateX(7px);
  }
}
.mis {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 10px;
  margin-bottom: 10px;
}
.mi {
  border: 1px solid var(--line);
  padding: 8px;
  display: grid;
  gap: 8px;
  animation: in .35s var(--ease);
}
.mi .th {
  width: 100%;
}
.mi .mc {
  display: flex;
  gap: 6px;
}
.rw {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
@media (max-width: 640px) {
  .grid2 {
    grid-template-columns: 1fr;
  }
  .imgf {
    flex-direction: column;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body>

<div class="gate" id="gate"><div class="box" id="gbox">
  <h2>Only vx here!</h2>
  <form id="gf"><input id="gi" type="password" autocomplete="off" placeholder="password?" aria-label="password"><button class="b solid" type="submit">go</button></form>
  <div class="err" id="ge"></div>
  <a class="hint" href="home">← back to site</a>
</div></div>

<div class="wrap" id="app" style="display:none">
  <div class="top">
    <h1>manage<span class="cur">_</span></h1>
    <div class="acts">
      <span class="chip" id="chip">saved</span>
      <a class="b" id="viewsite" href="home" target="_blank">view site ↗</a>
      <button class="b solid" id="save">save &amp; publish</button>
      <button class="b" id="lockout">lock</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-t="site">Site</button>
    <button class="tab" data-t="projects">Projects<sup id="c-projects"></sup></button>
    <button class="tab" data-t="toolkit">Toolkit<sup id="c-toolkit"></sup></button>
    <button class="tab" data-t="gallery">Gallery<sup id="c-gallery"></sup></button>
    <button class="tab" data-t="publish">Publishing</button>
    <span class="ink" id="inkbar"></span>
  </div>
  <div class="panel" id="panel"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const HASH = "6cb8947f869a1332785a2c4a673cb8a2529c528a0de18239c4a4594782599b29";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pad = (n) => String(n).padStart(2, "0");
const uid = () => "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
let D = null, tab = "site", dirty = false, openIds = {}, previews = {};
async function sha(t) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
}
function enter() {
  $("#gate").style.display = "none";
  $("#app").style.display = "";
  boot();
}
$("#gf").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!(window.crypto && crypto.subtle)) {
    $("#ge").textContent = "needs a secure (https) connection";
    return;
  }
  if (await sha($("#gi").value) === HASH) {
    sessionStorage.setItem("vx_auth", HASH);
    enter();
  } else {
    $("#ge").textContent = "nope, try again";
    $("#gi").value = "";
    const b = $("#gbox");
    b.classList.remove("shake");
    void b.offsetWidth;
    b.classList.add("shake");
  }
});
const EMB = window.parent !== window;
if (EMB) {
  const v = $("#viewsite");
  v.textContent = "back to site";
  v.removeAttribute("target");
  v.removeAttribute("href");
  v.style.cursor = "pointer";
  v.addEventListener("click", () => parent.postMessage("vx-close", location.origin));
}
$("#lockout").addEventListener("click", () => {
  if (EMB) parent.postMessage("vx-lock", location.origin);
  else {
    sessionStorage.removeItem("vx_auth");
    location.href = "home";
  }
});
const CFG = () => Object.assign({ repo: "VxpeInjected/vx-portfolio", branch: "main", token: "" }, JSON.parse(localStorage.getItem("vx_cfg") || "{}"));
const setCFG = (o) => localStorage.setItem("vx_cfg", JSON.stringify(Object.assign(CFG(), o)));
const SITE_DEFAULT = { name: "vx.injected", logo: "VX", badge: "programmer & UI designer", status: "open for commissions", statusOn: true, tagline: "I build systems and interfaces.\nRoblox programming, bots and thoughtful UI design.", intro: "", email: "", discord: "", discordUrl: "", toolkitBlurb: "", galleryBlurb: "", contactBlurb: "", footerNote: "" };
function normP(p) {
  if (!Array.isArray(p.images)) p.images = p.image ? [{ src: p.image, caption: "" }] : [];
  delete p.image;
  return p;
}
function norm(d) {
  d = d || {};
  return { site: Object.assign({}, SITE_DEFAULT, d.site || {}), projects: (d.projects || []).map(normP), toolkit: d.toolkit || [], gallery: d.gallery || [] };
}
async function boot() {
  let live = null;
  try {
    const r = await fetch("data.json?" + Date.now(), { cache: "no-store" });
    if (r.ok) live = await r.json();
  } catch (e) {
  }
  const draft = localStorage.getItem("vx_draft");
  if (draft) {
    try {
      D = norm(JSON.parse(draft));
      dirty = true;
      bn = "draft";
    } catch (e) {
    }
  }
  if (!D) D = norm(live);
  window._live = live;
  setDirty(dirty);
  render();
}
let bn = "";
function setDirty(v) {
  dirty = v;
  const c = $("#chip");
  c.classList.toggle("dirty", v);
  c.textContent = v ? "unsaved changes" : "saved";
  if (v) localStorage.setItem("vx_draft", JSON.stringify(D));
  else localStorage.removeItem("vx_draft");
}
addEventListener("beforeunload", (e) => {
  if (dirty) {
    e.preventDefault();
    e.returnValue = "";
  }
});
function toast(t, bad) {
  const el = $("#toast");
  el.textContent = t;
  el.classList.toggle("bad", !!bad);
  el.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove("show"), bad ? 5e3 : 2800);
}
function ink() {
  const t = $(".tab.on"), k = $("#inkbar");
  if (t) {
    k.style.left = t.offsetLeft + "px";
    k.style.width = t.offsetWidth + "px";
  }
}
$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab");
  if (!b) return;
  tab = b.dataset.t;
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b));
  ink();
  render();
});
addEventListener("resize", ink);
document.fonts && document.fonts.ready.then(ink);
const SCHEMA = {
  projects: {
    label: "project",
    title: (i) => i.title || "untitled project",
    sub: (i) => i.category || "",
    fields: [
      ["title", "title", "text"],
      ["category", "category", "select", ["programming", "ui design"]],
      ["meta", "meta line (e.g. Gameplay systems / Luau)", "text"],
      ["note", "small note (e.g. 2026)", "text"],
      ["link", "link (optional)", "text"],
      ["tags", "tags (comma separated)", "tags"],
      ["desc", "description", "area"],
      ["images", "screenshots / pages (shown as a gallery in the popup)", "images"]
    ],
    blank: () => ({ id: uid(), title: "", category: "programming", meta: "", note: "", desc: "", tags: [], link: "", images: [] })
  },
  toolkit: {
    label: "tool",
    title: (i) => i.name || "untitled tool",
    sub: (i) => i.icon || "",
    fields: [
      ["name", "name", "text"],
      ["desc", "short description", "text"],
      ["icon", "icon", "select", ["cube", "code", "pen", "cursor", "layers", "terminal", "globe"]]
    ],
    blank: () => ({ id: uid(), name: "", desc: "", icon: "cube" })
  },
  gallery: {
    label: "image",
    title: (i) => i.caption || "untitled image",
    sub: (i) => "",
    fields: [
      ["caption", "caption", "text"],
      ["title", "popup title (optional)", "text"],
      ["desc", "popup description", "area"],
      ["image", "image", "image"]
    ],
    blank: () => ({ id: uid(), caption: "", title: "", desc: "", image: "" })
  }
};
function render() {
  ["projects", "toolkit", "gallery"].forEach((c) => $("#c-" + c).textContent = pad(D[c].length));
  const p = $("#panel");
  p.style.animation = "none";
  void p.offsetWidth;
  p.style.animation = "";
  if (tab === "site") p.innerHTML = siteHTML();
  else if (tab === "publish") p.innerHTML = pubHTML();
  else p.innerHTML = listHTML(tab);
  ink();
}
function fieldHTML(col, idx, it, f) {
  const [key, label, type, opts] = f, val = it[key];
  const a = `data-col="${col}" data-idx="${idx}" data-key="${key}"`;
  if (type === "select") return `<label class="fld"><span>${label}</span><select ${a}>${opts.map((o) => `<option ${o === val ? "selected" : ""}>${o}</option>`).join("")}</select></label>`;
  if (type === "area") return `<label class="fld"><span>${label}</span><textarea ${a}>${esc(val)}</textarea></label>`;
  if (type === "tags") return `<label class="fld"><span>${label}</span><input type="text" ${a} data-tags="1" value="${esc((val || []).join(", "))}"></label>`;
  if (type === "images") {
    const arr = it.images || [], b = (act, n, t, dis) => `<button class="b sm${act === "imgx" ? " dng" : ""}" data-act="${act}" data-col="${col}" data-idx="${idx}" data-ii="${n}" ${dis ? "disabled" : ""}>${t}</button>`;
    return `<div class="fld"><span>${label}</span><div class="mis">${arr.map((m, n) => {
      const src = previews[m.src] || m.src;
      return `<div class="mi"><div class="th">${src ? `<img src="${esc(src)}" onerror="this.remove()">` : "no image"}</div><input class="tx" type="text" placeholder="caption (optional)" data-col="${col}" data-idx="${idx}" data-ii="${n}" value="${esc(m.caption || "")}"><div class="mc">${b("imgl", n, "←", n === 0)}${b("imgr", n, "→", n === arr.length - 1)}${b("imgx", n, "remove")}</div></div>`;
    }).join("")}</div>
    <div class="rw"><button class="b sm" data-act="addimgs" data-col="${col}" data-idx="${idx}">+ upload images</button><span class="hint" id="up-${col}-${idx}"></span></div>
    <div class="rw" style="margin-top:8px"><input class="tx" style="flex:1;min-width:160px;width:auto" id="url-${col}-${idx}" placeholder="or paste an image URL"><button class="b sm" data-act="addurl" data-col="${col}" data-idx="${idx}">add</button></div></div>`;
  }
  if (type === "image") {
    const src = previews[val] || val;
    return `<div class="imgf"><div class="th">${src ? `<img src="${esc(src)}" onerror="this.remove()">` : "no image"}</div><div class="r"><div class="row"><button class="b sm" data-act="upload" data-col="${col}" data-idx="${idx}">upload image</button><button class="b sm dng" data-act="rmimg" data-col="${col}" data-idx="${idx}">remove</button></div><input class="tx" type="text" ${a} placeholder="or paste an image URL" value="${esc(val)}"><span class="hint" id="up-${col}-${idx}"></span></div></div>`;
  }
  return `<label class="fld"><span>${label}</span><input type="text" ${a} value="${esc(val)}"></label>`;
}
function listHTML(col) {
  const S = SCHEMA[col], L = D[col];
  let h = `<button class="b solid add" data-act="add" data-col="${col}">+ add ${S.label}</button>`;
  if (bn === "draft") {
    h = `<div class="bn"><span>restored your unsaved draft from this browser.</span><button class="b sm" data-act="discard">discard draft</button></div>` + h;
  }
  if (!L.length) return h + `<div class="empty">nothing here yet.</div>`;
  return h + L.map((it, i) => {
    const o = openIds[it.id];
    return `<div class="item" data-col="${col}" data-idx="${i}"><div class="ih"><span class="n">${pad(i + 1)}</span><span class="ti" data-act="toggle" data-col="${col}" data-idx="${i}"><span class="tt">${esc(S.title(it))}</span><i>${esc(S.sub(it))}</i></span>
      <div class="ctl"><button class="b sm" data-act="up" data-col="${col}" data-idx="${i}" ${i === 0 ? "disabled" : ""}>↑</button><button class="b sm" data-act="down" data-col="${col}" data-idx="${i}" ${i === L.length - 1 ? "disabled" : ""}>↓</button><button class="b sm" data-act="toggle" data-col="${col}" data-idx="${i}">${o ? "close" : "edit"}</button><button class="b sm dng" data-act="del" data-col="${col}" data-idx="${i}">delete</button></div></div>
      ${o ? `<div class="ib">${S.fields.map((f) => fieldHTML(col, i, it, f)).join("")}</div>` : ""}</div>`;
  }).join("");
}
function siteHTML() {

}
function pubHTML() {

}
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.cfg) {
    setCFG({ [t.dataset.cfg]: t.value.trim() });
    return;
  }
  if (t.dataset.ii !== void 0 && t.dataset.col) {
    const m = D[t.dataset.col][+t.dataset.idx].images[+t.dataset.ii];
    if (m) {
      m.caption = t.value;
      setDirty(true);
    }
    return;
  }
  const col = t.dataset.col;
  if (!col || !t.dataset.key) return;
  const val = t.type === "checkbox" ? t.checked : t.value;
  if (col === "site") {
    D.site[t.dataset.key] = val;
  } else {
    const it = D[col][+t.dataset.idx];
    if (!it) return;
    it[t.dataset.key] = t.dataset.tags ? val.split(",").map((x) => x.trim()).filter(Boolean) : val;
    const row = t.closest(".item");
    if (row) {
      $(".tt", row).textContent = SCHEMA[col].title(it);
    }
    if (t.dataset.key === "image") {
      const th = t.closest(".imgf").querySelector(".th");
      th.innerHTML = val ? `<img src="${esc(val)}" onerror="this.remove()">` : "no image";
    }
  }
  setDirty(true);
});
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, col = b.dataset.col, i = +b.dataset.idx;
  if (act === "add") {
    const it = SCHEMA[col].blank();
    D[col].push(it);
    openIds[it.id] = true;
    setDirty(true);
    render();
    const ins = document.querySelectorAll(".item");
    ins[ins.length - 1] && ins[ins.length - 1].scrollIntoView({ behavior: "smooth", block: "center" });
  } else if (act === "toggle") {
    const it = D[col][i];
    openIds[it.id] = !openIds[it.id];
    render();
  } else if (act === "up" && i > 0) {
    [D[col][i - 1], D[col][i]] = [D[col][i], D[col][i - 1]];
    setDirty(true);
    render();
  } else if (act === "down" && i < D[col].length - 1) {
    [D[col][i + 1], D[col][i]] = [D[col][i], D[col][i + 1]];
    setDirty(true);
    render();
  } else if (act === "del") {
    if (b.dataset.sure) {
      D[col].splice(i, 1);
      setDirty(true);
      render();
      toast("removed");
    } else {
      b.dataset.sure = "1";
      b.textContent = "sure?";
      setTimeout(() => {
        if (b.isConnected) {
          delete b.dataset.sure;
          b.textContent = "delete";
        }
      }, 2500);
    }
  } else if (act === "discard") {
    localStorage.removeItem("vx_draft");
    dirty = false;
    bn = "";
    D = norm(window._live);
    setDirty(false);
    render();
    toast("draft discarded");
  } else if (act === "rmimg") {
    D[col][i].image = "";
    setDirty(true);
    render();
  } else if (act === "upload") {
    pickImage(col, i);
  } else if (act === "addimgs") {
    pickImages(col, i);
  } else if (act === "addurl") {
    const f = document.getElementById(`url-${col}-${i}`), v = (f.value || "").trim();
    if (!/^https?:\/\//i.test(v)) {
      toast("paste a full https:// image link", true);
      return;
    }
    D[col][i].images.push({ src: v, caption: "" });
    setDirty(true);
    render();
  } else if (act === "imgl" || act === "imgr") {
    const ii = +b.dataset.ii, A = D[col][i].images, j = act === "imgl" ? ii - 1 : ii + 1;
    if (j >= 0 && j < A.length) {
      [A[ii], A[j]] = [A[j], A[ii]];
      setDirty(true);
      render();
    }
  } else if (act === "imgx") {
    D[col][i].images.splice(+b.dataset.ii, 1);
    setDirty(true);
    render();
  } else if (act === "test") {
    testConn();
  } else if (act === "export") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(D, null, 2)], { type: "application/json" }));
    a.download = "data.json";
    a.click();
  } else if (act === "forget") {
    setCFG({ token: "" });
    render();
    toast("token removed from this browser");
  }
});
function api(path, opts = {}) {
  const c = CFG();
  return fetch(`https://api.github.com/repos/${c.repo.trim()}${path ? "/" + path : ""}`, Object.assign({}, opts, { headers: Object.assign({ Authorization: "Bearer " + (c.token || "").trim(), Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }, opts.headers || {}) }));
}
async function putFile(path, content, msg, isB64) {
  const c = CFG();
  const b64 = isB64 ? content : btoa(unescape(encodeURIComponent(content)));
  for (let tries = 0; tries < 2; tries++) {
    let sha2;
    const g = await api(`contents/${path}?ref=${encodeURIComponent(c.branch)}&t=${Date.now()}`);
    if (g.ok) sha2 = (await g.json()).sha;
    else if (g.status !== 404) throw new Error(await errText(g));
    const r = await api(`contents/${path}`, { method: "PUT", body: JSON.stringify({ message: msg, content: b64, branch: c.branch, sha: sha2 }) });
    if (r.ok) return true;
    if (r.status !== 409 && r.status !== 422) throw new Error(await errText(r));
  }
  throw new Error("could not save " + path + " (conflict)");
}
async function errText(r) {
  let m = "";
  try {
    m = (await r.json()).message;
  } catch (e) {
  }
  if (r.status === 401) return "token rejected (401). check it in publishing.";
  if (r.status === 403 || r.status === 404) return `no access (${r.status}). token needs contents read & write on ${CFG().repo}.`;
  return `github said ${r.status}${m ? ": " + m : ""}`;
}
async function testConn() {
  const m = $("#pubmsg");
  if (!CFG().token) {
    m.textContent = "paste a token first.";
    return;
  }
  m.textContent = "testing…";
  try {
    const r = await api("");
    if (!r.ok) throw new Error(await errText(r));
    const j = await r.json();
    m.textContent = j.permissions && j.permissions.push ? `connected to ${j.full_name} — write access ok.` : `connected to ${j.full_name}, but this token can't write.`;
  } catch (e) {
    m.textContent = e instanceof TypeError ? "couldn't reach github. check your connection or an ad blocker, and that the repo name is right." : e.message;
  }
}
$("#save").addEventListener("click", async () => {
  const btn = $("#save");
  if (!CFG().token) {
    toast("add your github token under publishing first", true);
    tab = "publish";
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x.dataset.t === "publish"));
    render();
    return;
  }
  btn.disabled = true;
  btn.textContent = "saving…";
  try {
    await putFile("data.json", JSON.stringify(D, null, 2) + "\n", "Update site data");
    window._live = JSON.parse(JSON.stringify(D));
    bn = "";
    setDirty(false);
    toast("saved. live in about a minute.");
  } catch (e) {
    toast(e instanceof TypeError ? "couldn't reach github. check your connection or an ad blocker." : e.message, true);
  }
  btn.disabled = false;
  btn.textContent = "save & publish";
});
async function processUpload(file) {
  const url = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
  const im = await new Promise((res, rej) => {
    const x = new Image();
    x.onload = () => res(x);
    x.onerror = rej;
    x.src = url;
  });
  const sc = Math.min(1, 1600 / Math.max(im.width, im.height)), cv = document.createElement("canvas");
  cv.width = Math.round(im.width * sc);
  cv.height = Math.round(im.height * sc);
  const cx = cv.getContext("2d");
  cx.fillStyle = "#fff";
  cx.fillRect(0, 0, cv.width, cv.height);
  cx.drawImage(im, 0, 0, cv.width, cv.height);
  const out = cv.toDataURL("image/jpeg", 0.88), b64 = out.split(",")[1];
  const slug = (file.name.replace(/\.[^.]+$/, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "image").slice(0, 40);
  const path = `uploads/${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}-${slug}.jpg`;
  await putFile(path, b64, "Upload image", true);
  previews[path] = out;
  return path;
}
function pickFiles(multiple, cb) {
  if (!CFG().token) {
    toast("add your github token under publishing first", true);
    return;
  }
  const f = document.createElement("input");
  f.type = "file";
  f.accept = "image/*";
  f.multiple = multiple;
  f.onchange = () => {
    if (f.files.length) cb([...f.files]);
  };
  f.click();
}
function pickImage(col, i) {
  pickFiles(false, async (files) => {
    const h = document.getElementById(`up-${col}-${i}`);
    if (h) h.textContent = "uploading…";
    try {
      const path = await processUpload(files[0]);
      D[col][i].image = path;
      setDirty(true);
      render();
      toast("image uploaded");
    } catch (e) {
      if (h) h.textContent = "";
      toast(e instanceof TypeError ? "couldn't reach github." : e.message || "upload failed", true);
    }
  });
}
function pickImages(col, i) {
  pickFiles(true, async (files) => {
    const h = document.getElementById(`up-${col}-${i}`);
    let done = 0;
    try {
      for (const file of files) {
        if (h) h.textContent = `uploading ${done + 1} of ${files.length}…`;
        const path = await processUpload(file);
        D[col][i].images.push({ src: path, caption: "" });
        done++;
        setDirty(true);
      }
      render();
      toast(done + (done === 1 ? " image" : " images") + " uploaded");
    } catch (e) {
      if (done) {
        render();
      } else if (h) h.textContent = "";
      toast(e instanceof TypeError ? "couldn't reach github." : e.message || "upload failed", true);
    }
  });
}
if (sessionStorage.getItem("vx_auth") === HASH) enter();
else setTimeout(() => $("#gi").focus(), 100);
