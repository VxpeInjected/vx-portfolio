<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vx.injected</title>
<meta name="description" content="My portfolio (vx.injected), contact me on discord @vx.injected or via e-mail at vxpeinjected@coldd.dev.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--paper:#fbfbf9;--ink:#171717;--mute:#85857f;--faint:#b9b9b3;--line:#e9e9e4;--fill:#f4f4f1;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{background:var(--bg);color:var(--ink);font:13px/1.7 "IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased;padding-bottom:90px}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:20px;background:var(--bg);z-index:29;pointer-events:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
::selection{background:var(--ink);color:#fff}
.navwrap{max-width:none;margin:0;padding:18px 12px 12px;position:sticky;top:0;z-index:30;background:linear-gradient(var(--bg) 78%,rgba(255,255,255,0))}
.navwrap .bar{max-width:760px;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 16px;background:rgba(251,251,249,.9);border:1px solid var(--line);backdrop-filter:blur(8px);transition:box-shadow .3s}
.bar.stuck{box-shadow:0 6px 24px -14px rgba(0,0,0,.25)}
.logo{display:grid;place-items:center;width:26px;height:26px;background:var(--ink);color:#fff;font-size:10px;font-weight:700;letter-spacing:.04em;transition:transform .4s var(--ease),background .25s,color .25s,box-shadow .25s}
.logo:hover{transform:rotate(-8deg) scale(1.08);box-shadow:3px 3px 0 var(--faint)}
.links{display:flex;gap:26px}
.links a{position:relative;font-size:11.5px;display:inline-flex;align-items:center;gap:4px;padding:4px 0}
.links a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:right;transition:transform .35s var(--ease)}
.links a:hover::after{transform:scaleX(1);transform-origin:left}
.links a svg{font-size:9px;transition:transform .3s var(--ease)}
.links a:hover svg{transform:translate(2px,-2px)}
.col{max-width:784px;margin:0 auto;padding:0 29px}
.hero{padding-top:72px}
.status{display:flex;align-items:center;gap:8px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.dot{position:relative;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--ink);opacity:0;animation:ping 2.4s infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.5}80%,100%{transform:scale(1.5);opacity:0}}
.nameRow{display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin-top:22px}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.badge{background:var(--ink);color:#fff;font-size:10px;font-weight:600;padding:4px 9px;transition:transform .3s var(--ease),box-shadow .3s}
.badge:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--faint)}
.tag{margin-top:34px;font-size:13px;white-space:pre-line}
.intro{margin-top:20px;font-size:12px;color:var(--mute);max-width:430px}
.explore{display:inline-flex;align-items:center;gap:10px;margin-top:26px;font-size:11px;padding-bottom:5px;border-bottom:1px solid var(--ink)}
.explore svg{transition:transform .45s var(--ease)}
.explore:hover svg{transform:translateY(3px)}
section.s{margin-top:96px}
.sh{display:flex;justify-content:space-between;align-items:baseline}
h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.cur{display:inline-block;animation:blink 1.1s steps(1) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.lab{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.blurb{margin-top:14px;font-size:11.5px;color:var(--mute)}
.tabs{position:relative;display:flex;gap:26px;margin-top:26px;border-bottom:1px solid var(--line)}
.tab{position:relative;padding:0 0 12px;font-size:11px;color:var(--mute);transition:color .25s}
.tab:hover,.tab.on{color:var(--ink)}
.tab sup{font-size:7.5px;margin-left:3px;color:var(--faint)}
.ink{position:absolute;left:0;bottom:-1px;height:1px;background:var(--ink);transition:left .45s var(--ease),width .45s var(--ease)}
.row{position:relative;display:grid;grid-template-columns:32px 1fr 30px;align-items:center;width:100%;padding:20px 0;border-bottom:1px solid var(--line)}
.row::before{content:"";position:absolute;inset:0;background:var(--fill);transform:scaleY(0);transform-origin:bottom;transition:transform .35s var(--ease);z-index:0}
.row:hover::before,.row:focus-visible::before{transform:scaleY(1)}
.row>*{position:relative;z-index:1}
.row .n{font-size:9px;color:var(--faint);transition:color .25s}
.row .rt{display:block;transition:transform .4s var(--ease)}
.row:hover .rt{transform:translateX(8px)}
.row:hover .n{color:var(--ink)}
.row .t{display:block;font-size:13px}
.row .m{display:block;margin-top:4px;font-size:10px;color:var(--mute)}
.row .m i{font-style:normal;color:var(--faint);margin-left:6px}
.row .ar{justify-self:center;color:var(--mute);font-size:13px;transition:transform .4s var(--ease),color .25s}
.row:hover .ar{transform:translate(-2px,-2px);color:var(--ink)}
.empty{padding:26px 0;font-size:11.5px;color:var(--mute);border-bottom:1px solid var(--line)}
.tools{margin-top:28px;display:grid;gap:15px}
.tool{display:grid;grid-template-columns:28px 176px 1fr;align-items:center;font-size:11.5px}
.tool svg{font-size:15px;color:var(--mute);transition:transform .4s var(--ease),color .25s}
.tool:hover svg{transform:rotate(-8deg) scale(1.2);color:var(--ink)}
.tool span.d{font-size:10.5px;color:var(--mute);transition:transform .35s var(--ease)}
.tool:hover span.d{transform:translateX(5px)}
.gal{margin-top:28px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.item{display:block;width:100%}
.frame{border:1px solid var(--line);padding:5px;background:#fff;transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .25s}
.item:hover .frame{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 14px 26px -16px rgba(0,0,0,.35);border-color:var(--faint)}
.in{position:relative;aspect-ratio:126/156;background:var(--fill);display:grid;place-items:center;overflow:hidden}
.in img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.item:hover .in img{transform:scale(1.05)}
.ph{display:grid;justify-items:center;gap:6px;color:var(--faint);font-size:7.5px;letter-spacing:.12em;text-transform:uppercase}
.ph svg{font-size:18px}
.in .gn{position:absolute;left:6px;bottom:5px;font-size:8px;color:var(--faint);z-index:1}
.item .cap{display:block;margin-top:14px;font-size:10px}
.contact{margin-top:28px;display:flex;align-items:center;flex-wrap:wrap;gap:6px 28px;font-size:11.5px}
.mail{display:inline-flex;align-items:center;gap:9px}
.mail>svg{font-size:15px;color:var(--mute)}
.copy{position:relative;display:inline-grid;place-items:center;width:24px;height:24px;color:var(--mute);transition:color .2s,transform .3s var(--ease)}
.copy:hover{color:var(--ink);transform:scale(1.15)}
.copy .tip{position:absolute;left:50%;bottom:130%;transform:translate(-50%,4px);background:var(--ink);color:#fff;font-size:9px;padding:2px 7px;opacity:0;pointer-events:none;transition:.25s var(--ease);white-space:nowrap}
.copy.ok .tip{opacity:1;transform:translate(-50%,0)}
.dc{display:inline-flex;gap:10px}
.dc b{font-weight:400;color:var(--mute)}

footer.f{margin-top:96px;padding-top:28px;border-top:1px solid var(--line)}
.fname{font-size:21px;font-style:italic;font-weight:500;letter-spacing:-.01em}
.frow{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:9.5px;color:var(--mute);flex-wrap:wrap}

/* lock */
.lock{position:fixed;right:20px;bottom:20px;z-index:40;width:42px;height:42px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);color:var(--mute);font-size:16px;transition:transform .35s var(--ease),color .25s,border-color .25s,box-shadow .35s,background .25s}
.lock:hover{transform:translateY(-3px);color:#fff;background:var(--ink);border-color:var(--ink);box-shadow:3px 3px 0 var(--faint)}
.lock .sh2{transition:transform .35s var(--ease);transform-origin:12px 11px}
.lock:hover .sh2{transform:translateY(-2px) rotate(-14deg)}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(20,20,18,.42);backdrop-filter:blur(7px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.modal.open{opacity:1;visibility:visible}
.dlg{position:relative;width:min(900px,100%);max-height:94vh;overflow:auto;background:#fff;padding:44px 48px 34px;transform:translateY(18px) scale(.97);transition:transform .45s var(--ease)}
.modal.open .dlg{transform:none}
.x{position:absolute;right:20px;top:18px;width:34px;height:34px;display:grid;place-items:center;font-size:18px;transition:transform .35s var(--ease)}
.x:hover{transform:rotate(90deg)}
.eb{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.dlg h3{margin-top:18px;font-size:21px;font-weight:700;letter-spacing:-.01em}
.media{position:relative;margin-top:24px;aspect-ratio:16/9;background:var(--fill);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--fill);transition:opacity .3s}
.mb{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;background:rgba(255,255,255,.94);border:1px solid var(--line);font-size:15px;text-align:center;z-index:2;transition:background .25s,color .25s,transform .3s var(--ease),border-color .25s}
.mb.l{left:12px}.mb.r{right:12px}
.mb:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.mb.l:hover{transform:translateY(-50%) translateX(-3px)}.mb.r:hover{transform:translateY(-50%) translateX(3px)}
.cnt{position:absolute;left:12px;bottom:10px;z-index:2;font-size:9.5px;letter-spacing:.1em;background:rgba(255,255,255,.94);border:1px solid var(--line);padding:2px 8px}
.icap{margin-top:10px;font-size:11px;color:var(--mute);min-height:0}
.thumbs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding:2px 2px 6px}
.thumbs button{flex:0 0 88px;aspect-ratio:16/10;border:1px solid var(--line);padding:2px;background:#fff;opacity:.5;transition:opacity .25s,border-color .25s,transform .3s var(--ease)}
.thumbs button:hover{opacity:.85;transform:translateY(-2px)}
.thumbs button.on{opacity:1;border-color:var(--ink)}
.thumbs img{display:block;width:100%;height:100%;object-fit:cover}
.media .ph{font-size:10px;gap:8px;text-transform:none;letter-spacing:0}
.media .ph svg{font-size:32px}
.dlg .desc{margin-top:24px;font-size:12.5px;color:#3d3d39;white-space:pre-line}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips span{border:1px solid var(--line);padding:3px 9px;font-size:10px;transition:background .2s,color .2s,border-color .2s}
.chips span:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.visit{display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:9px 15px;border:1px solid var(--ink);font-size:11px;background:linear-gradient(var(--ink),var(--ink)) left/0 100% no-repeat;transition:background-size .4s var(--ease),color .3s}
.visit:hover{background-size:100% 100%;color:#fff}
.visit svg{transition:transform .3s var(--ease)}
.visit:hover svg{transform:translate(2px,-2px)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--mute)}
.mnav button{display:inline-flex;gap:6px;align-items:center;transition:color .2s,transform .3s var(--ease)}
.mnav button:hover{color:var(--ink)}
.mnav .pv:hover{transform:translateX(-3px)}.mnav .nx:hover{transform:translateX(3px)}
.mnav button[disabled]{opacity:.3;pointer-events:none}

/* password */
.pwdlg{width:min(400px,100%);padding:34px 32px 28px}
.pwdlg h3{font-size:16px;margin-top:14px}
.pwdlg p{font-size:11px;color:var(--mute);margin-top:6px}
.pwdlg form{margin-top:20px;display:flex;gap:8px}
.pwdlg input{flex:1;min-width:0;border:1px solid var(--line);padding:10px 12px;font:inherit;font-size:12px;outline:none;transition:border-color .2s}
.pwdlg input:focus{border-color:var(--ink)}
.go{padding:0 16px;background:var(--ink);color:#fff;font-size:11px;transition:transform .3s var(--ease),box-shadow .3s}
.go:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--faint)}
.err{height:14px;margin-top:10px;font-size:10px;color:#b3261e}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* reveal */
.rv{opacity:0;transform:translateY(16px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0s)}
.rv.show{opacity:1;transform:none}
@media(max-width:640px){
  .col{padding:0 20px}.navwrap{padding:0 10px}.links{gap:16px}
  .gal{grid-template-columns:repeat(3,1fr)}
  .tool{grid-template-columns:26px 132px 1fr}
  .dlg{padding:34px 22px 24px}.dlg h3{font-size:18px}
  .hero{padding-top:56px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

    <a href="#about">About</a>

</div></div>

<main class="col" id="top">
  <section class="hero" id="about">

      <button class="tab on" data-f="all">All work<sup id="cAll">00</sup></button>

      <button class="tab" data-f="ui design">UI design</button>
      <span class="ink" id="inkbar"></span>
    </div>

  </section>

  <section class="s" id="toolkit">
    <div class="sh rv"><h2>my toolkit<span class="cur">_</span></h2><span class="lab">02 / Tools</span></div>

  <section class="s" id="gallery">

  <section class="s" id="contact">

      <span class="mail"><svg class="i"><use href="#i-mail"/></svg><span id="email"></span>

  <footer class="f rv">

    <div class="frow"><span id="fnote"></span><span id="fcopy"></span></div>

</main>

<button class="lock" id="lock" aria-label="manage site">
  <svg class="i" viewBox="0 0 24 24"><rect width="16" height="11" x="4" y="11" rx="2"/><g class="sh2"><path d="M8 11V7a4 4 0 0 1 8 0v4"/></g></svg>
</button>

<div class="modal" id="modal"><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>

<div class="modal" id="pw"><div class="dlg pwdlg" id="pwd" role="dialog" aria-modal="true">
  <button class="x" id="pwx" aria-label="close"><svg class="i"><use href="#i-x"/></svg></button>
  <div class="eb">restricted</div>
  <h3>enter password</h3>
  <p>Management access only.</p>
  <form id="pwf"><input id="pwi" type="password" autocomplete="off" placeholder="password" aria-label="password"><button class="go" type="submit">unlock</button></form>
  <div class="err" id="pwe"></div>
</div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></symbol>

</svg>

<script>
const HASH="6cb8947f869a1332785a2c4a673cb8a2529c528a0de18239c4a4594782599b29";
const DEFAULT={"site": {"name": "vx.injected", "logo": "VX", "badge": "programmer & UI designer", "status": "open for commissions", "statusOn": true, "tagline": "I build systems and interfaces.\nRoblox programming, bots and thoughtful UI design.", "intro": "Nine years of programming and six of UI/UX. Mostly Luau, Python and JavaScript. Based in England.", "email": "businessemail.rv@gmail.com", "discord": "vxpe.injected", "discordUrl": "", "toolkitBlurb": "The tools behind the pixels and the play.", "galleryBlurb": "A little space for screens, concepts, and experiments.", "contactBlurb": "Have a project in mind? Let's talk.", "footerNote": "Code with purpose. Design with care."}, "projects": [], "toolkit": [{"id": "t1", "name": "Roblox Studio", "desc": "building experiences", "icon": "cube"}, {"id": "t2", "name": "Luau", "desc": "gameplay & systems", "icon": "code"}, {"id": "t3", "name": "Python", "desc": "bots & tooling", "icon": "terminal"}, {"id": "t4", "name": "JavaScript / TypeScript", "desc": "web & front-end", "icon": "globe"}, {"id": "t5", "name": "UI / UX", "desc": "player-first design", "icon": "cursor"}], "gallery": []};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url=u=>/^https?:\/\//i.test(u||"")?u:"";
const img=u=>/^(https?:\/\/|uploads\/|data:image\/)/i.test(u||"")?u:"";
const ico=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const pad=n=>String(n).padStart(2,"0");
let D=DEFAULT, filter="all", cur=null;

function norm(d){
  d=d||{};
  return {site:Object.assign({},DEFAULT.site,d.site||{}),
    projects:Array.isArray(d.projects)?d.projects:[],
    toolkit:Array.isArray(d.toolkit)?d.toolkit:DEFAULT.toolkit,
    gallery:Array.isArray(d.gallery)?d.gallery:[]};
}
async function load(){
  try{const r=await fetch("data.json?"+Date.now(),{cache:"no-store"});if(r.ok)D=norm(await r.json());}catch(e){D=norm(DEFAULT)}
  render();
}

function render(){
  const s=D.site;
  document.title=s.name
  $("#logo").textContent=s.logo||"VX";
  $("#name").textContent=s.name;
  $("#badge").textContent=s.badge;
  $("#tag").textContent=s.tagline;
  $("#intro").textContent=s.intro;
  const st=$("#status");st.style.display=s.statusOn&&s.status?"":"none";$("#statusT").textContent=s.status;
  $("#email").textContent=s.email;
  $("#nEmail").href="mailto:"+s.email;
  const du=url(s.discordUrl);
  const nd=$("#nDiscord");nd.href=du||"#contact";if(du){nd.target="_blank";nd.rel="noopener"}else{nd.removeAttribute("target")}
  $("#disc").textContent=s.discord;
  $("#tkB").textContent=s.toolkitBlurb;$("#gaB").textContent=s.galleryBlurb;$("#coB").textContent=s.contactBlurb;
  $("#fname").textContent=s.name+".";$("#fnote").textContent=s.footerNote;$("#fcopy").textContent="© "+new Date().getFullYear()+" "+s.name;
  $("#cAll").textContent=pad(D.projects.length);
  renderList();
  $("#toolkit").style.display=D.toolkit.length?"":"none";
  $("#tools").innerHTML=D.toolkit.map((t,i)=>`<div class="tool rv" style="--d:${i*.06}s">${ico(t.icon||"cube")}<span>${esc(t.name)}</span><span class="d">${esc(t.desc)}</span></div>`).join("");
  $("#gallery").style.display=D.gallery.length?"":"none";
  $("#gal").innerHTML=D.gallery.map((g,i)=>`<button class="item rv" style="--d:${i*.07}s" data-g="${i}"><div class="frame"><div class="in">${img(g.image)?`<img src="${esc(img(g.image))}" alt="${esc(g.caption)}" loading="lazy">`:`<div class="ph">${ico("image")}<span>no image</span></div>`}<span class="gn">${pad(i+1)}</span></div></div><span class="cap">${esc(g.caption)}</span></button>`).join("");
  reveal();placeInk();
}
function vis(){return filter==="all"?D.projects:D.projects.filter(p=>(p.category||"programming")===filter)}
function renderList(){
  const L=vis();
  $("#list").innerHTML=L.length?L.map((p,i)=>`<button class="row rv" style="--d:${i*.07}s" data-p="${i}"><span class="n">${pad(i+1)}</span><span class="rt"><span class="t">${esc(p.title)}</span><span class="m">${esc(p.meta||"")}${p.note?`<i>/ ${esc(p.note)}</i>`:""}</span></span><span class="ar">${ico("ur")}</span></button>`).join(""):`<div class="empty rv">${D.projects.length?"nothing in this category yet.":"projects coming soon."}</div>`;
  reveal();
}
let io;
function reveal(){
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){
    const t=e.target;t.classList.add("show");io.unobserve(t);
    const done=()=>{t.classList.remove("rv","show");t.style.removeProperty("--d")};
    t.addEventListener("transitionend",ev=>{if(ev.target===t&&ev.propertyName==="opacity")done()});
    setTimeout(done,(parseFloat(t.style.getPropertyValue("--d"))||0)*1000+1100);
  }}),{threshold:.08,rootMargin:"0px 0px -4% 0px"});
  document.querySelectorAll(".rv:not(.show)").forEach(el=>io.observe(el));
}
function placeInk(){const t=$(".tab.on"),k=$("#inkbar");if(!t)return;k.style.left=t.offsetLeft+"px";k.style.width=t.offsetWidth+"px"}

$("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));filter=b.dataset.f;placeInk();renderList()});
addEventListener("resize",placeInk);
addEventListener("scroll",()=>$("#bar").classList.toggle("stuck",scrollY>20),{passive:true});
document.fonts&&document.fonts.ready.then(placeInk);

/* modal */
function openM(kind,i){
  cur={kind,i};drawM();$("#modal").classList.add("open");document.body.style.overflow="hidden";
}
function imgsOf(it){
  if(Array.isArray(it.images)&&it.images.length)return it.images.filter(x=>img(x&&x.src));
  return img(it.image)?[{src:it.image,caption:""}]:[];
}
function drawM(){
  const {kind,i}=cur,L=kind==="p"?vis():D.gallery,it=L[i];if(!it)return closeM();
  const ims=imgsOf(it),multi=ims.length>1,lk=url(it.link);
  cur.ims=ims;cur.k=0;
  const media=`<div class="media">${ims.length?`<img id="mimg" alt="">`:`<div class="ph">${ico("image")}<span>no preview yet</span></div>`}${multi?`<button class="mb l" data-im="-1" aria-label="previous image">←</button><button class="mb r" data-im="1" aria-label="next image">→</button><span class="cnt" id="cnt"></span>`:""}</div><div class="icap" id="icap"></div>${multi?`<div class="thumbs" id="thumbs">${ims.map((m,n)=>`<button data-th="${n}" aria-label="image ${n+1}"><img src="${esc(img(m.src))}" alt=""></button>`).join("")}</div>`:""}`;
  const eb=kind==="p"?`project preview / ${esc(it.category||"programming")}`:`image preview / ${pad(i+1)}`;
  const title=kind==="p"?it.title:(it.title||it.caption);
  const tags=kind==="p"&&it.tags&&it.tags.length?`<div class="chips">${it.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:"";
  $("#dlg").innerHTML=`<button class="x" data-close aria-label="close">${ico("x")}</button>
  <div class="eb">${eb}</div><h3>${esc(title)}</h3>${media}
  ${it.desc?`<p class="desc">${esc(it.desc)}</p>`:""}${tags}
  ${lk?`<a class="visit" href="${esc(lk)}" target="_blank" rel="noopener">view project ${ico("ur")}</a>`:""}
  <div class="mnav"><button class="pv" ${i===0?"disabled":""} data-nav="-1">← prev</button><span>${pad(i+1)} / ${pad(L.length)}</span><button class="nx" ${i===L.length-1?"disabled":""} data-nav="1">next →</button></div>`;
  if(ims.length)setImg(0,true);
}
function setImg(n,first){
  const ims=cur.ims;if(!ims||!ims.length)return;
  n=(n+ims.length)%ims.length;cur.k=n;
  const el=$("#mimg"),m=ims[n];if(!el)return;
  const apply=()=>{el.src=img(m.src);el.alt=m.caption||"";el.style.opacity=1};
  if(first)apply();else{el.style.opacity=0;clearTimeout(setImg.t);setImg.t=setTimeout(apply,170)}
  $("#icap").textContent=m.caption||"";
  const c=$("#cnt");if(c)c.textContent=pad(n+1)+" / "+pad(ims.length);
  document.querySelectorAll("#thumbs button").forEach((b,k)=>b.classList.toggle("on",k===n));
}
function closeM(){$("#modal").classList.remove("open");document.body.style.overflow=""}
$("#list").addEventListener("click",e=>{const r=e.target.closest(".row");if(r)openM("p",+r.dataset.p)});
$("#gal").addEventListener("click",e=>{const r=e.target.closest(".item");if(r)openM("g",+r.dataset.g)});
$("#modal").addEventListener("click",e=>{
  if(e.target.id==="modal"||e.target.closest("[data-close]"))return closeM();
  const im=e.target.closest("[data-im]");if(im)return setImg(cur.k+ +im.dataset.im);
  const th=e.target.closest("[data-th]");if(th)return setImg(+th.dataset.th);
  const n=e.target.closest("[data-nav]");if(n){cur.i+=+n.dataset.nav;drawM()}});

/* copy */
$("#copy").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(D.site.email)}catch(e){const t=document.createElement("textarea");t.value=D.site.email;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
  const b=$("#copy");b.classList.add("ok");setTimeout(()=>b.classList.remove("ok"),1400)});

/* lock */
const pwM=$("#pw");
$("#lock").addEventListener("click",()=>{pwM.classList.add("open");$("#pwe").textContent="";setTimeout(()=>$("#pwi").focus(),150)});
function closePw(){pwM.classList.remove("open");$("#pwi").value=""}
$("#pwx").addEventListener("click",closePw);
pwM.addEventListener("click",e=>{if(e.target===pwM)closePw()});
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
$("#pwf").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!(window.crypto&&crypto.subtle)){$("#pwe").textContent="needs a secure (https) connection";return}
  const h=await sha($("#pwi").value);
  if(h===HASH){sessionStorage.setItem("vx_auth",HASH);location.href="admin.html"}
  else{$("#pwe").textContent="wrong password";$("#pwi").value="";const d=$("#pwd");d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake")}
});
addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeM();closePw()}
  if($("#modal").classList.contains("open")&&cur){
    const many=cur.ims&&cur.ims.length>1;
    if(e.key==="ArrowRight"){if(many)setImg(cur.k+1);else{const L=cur.kind==="p"?vis():D.gallery;if(cur.i<L.length-1){cur.i++;drawM()}}}
    if(e.key==="ArrowLeft"){if(many)setImg(cur.k-1);else if(cur.i>0){cur.i--;drawM()}}}
});
load();
</script>
</body>
</html>
